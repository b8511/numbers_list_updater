<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Visualization</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
      }

      h1 {
        text-align: center;
        margin: 20px 0;
      }

      #number-list {
        list-style: none;
        padding: 0;
        text-align: center;
      }

      #number-list li {
        margin: 5px;
        padding: 8px 12px;
        border-radius: 5px;
        font-size: 18px;
        color: #333;
        position: relative;
        transition: all 0.3s ease-in-out;
      }

      .add-animation {
        background-color: #e0ffe0;
        animation: flashGreen 1s;
      }

      .remove-animation {
        background-color: #ffe0e0;
        animation: fadeOutRed 1s;
      }

      @keyframes flashGreen {
        0% {
          background-color: #e0ffe0;
        }

        100% {
          background-color: #a0ffa0;
        }
      }

      @keyframes fadeOutRed {
        0% {
          opacity: 1;
          background-color: #ffe0e0;
        }

        100% {
          opacity: 0;
          background-color: #ffe0e0;
        }
      }
    </style>
  </head>

  <body>
    <h1>List Visualization</h1>
    <ul id="number-list">
      <!-- List items will be populated using JavaScript -->
    </ul>

    <script>
      const numberListElement = document.getElementById("number-list");
      let currentList = [];

      // Function to render the entire list (used only for initial load)
      function renderList(numberList) {
        numberListElement.innerHTML = "";
        numberList.forEach((number) => {
          const listItem = document.createElement("li");
          listItem.textContent = number;
          listItem.dataset.value = number;
          numberListElement.appendChild(listItem);
        });
        currentList = [...numberList];
      }

      // Function to add a number to the list with animation
      function addNumber(number) {
        // Check if already exists
        if (currentList.includes(number)) {
          return;
        }

        currentList.push(number);
        currentList.sort((a, b) => a - b);

        // Find the correct position to insert
        const listItem = document.createElement("li");
        listItem.textContent = number;
        listItem.dataset.value = number;
        listItem.classList.add("add-animation");

        // Insert at the correct position
        const existingItems = Array.from(numberListElement.children);
        let inserted = false;
        for (let i = 0; i < existingItems.length; i++) {
          if (parseInt(existingItems[i].dataset.value) > number) {
            numberListElement.insertBefore(listItem, existingItems[i]);
            inserted = true;
            break;
          }
        }
        if (!inserted) {
          numberListElement.appendChild(listItem);
        }
      }

      // Function to remove a number from the list with animation
      function removeNumber(number) {
        const index = currentList.indexOf(number);
        if (index === -1) {
          return;
        }

        currentList.splice(index, 1);

        const listItem = Array.from(numberListElement.children).find(
          (item) => parseInt(item.dataset.value) === number
        );

        if (listItem) {
          listItem.classList.add("remove-animation");
          setTimeout(() => {
            listItem.remove();
          }, 1000);
        }
      }

      // Initial request for the number list
      (async function () {
        const response = await fetch("/get_number_list");
        const data = await response.json();
        renderList(data.number_list);

        // Connect to SSE stream AFTER initial list is loaded
        const eventSource = new EventSource("/stream");

        eventSource.onmessage = function (event) {
          const message = JSON.parse(event.data);
          const msgType = message.type;
          const number = message.number;

          if (msgType === "add_new_item") {
            addNumber(number);
          } else if (msgType === "deleted_item") {
            removeNumber(number);
          }
        };
      })();
    </script>
  </body>
</html>
